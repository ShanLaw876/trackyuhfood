services:
  - type: web
    name: trackyuhfood
    runtime: node
    plan: starter
    buildCommand: npm ci && npm run build
    preDeployCommand: npm run migrate
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 24
      - key: DATABASE_URL
        fromDatabase:
          name: trackyuhfood-db
          property: connectionString
      - key: BETTER_AUTH_SECRET
        generateValue: true
      - key: BETTER_AUTH_URL
        sync: false
      - key: APP_ORIGIN
        sync: false
databases:
  - name: trackyuhfood-db
    plan: basic-256mb
    databaseName: trackyuhfood
